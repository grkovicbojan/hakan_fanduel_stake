<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" role="img" aria-label="Sports market research illustration">
  <!-- Transparent ground and mid-tone palette so the art reads on both the day
       and night themes without an opaque light plate behind it. -->
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0.05"/>
    </linearGradient>
  </defs>

  <rect x="60" y="40" width="680" height="320" rx="18" fill="url(#panel)" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="2"/>

  <!-- Price grid -->
  <g stroke="#94a3b8" stroke-opacity="0.35" stroke-width="1.5">
    <line x1="110" y1="300" x2="690" y2="300"/>
    <line x1="110" y1="240" x2="690" y2="240"/>
    <line x1="110" y1="180" x2="690" y2="180"/>
    <line x1="110" y1="120" x2="690" y2="120"/>
  </g>

  <!-- Line movement -->
  <polyline points="130,282 220,236 310,254 400,178 490,206 580,140 670,112"
            fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#38bdf8">
    <circle cx="220" cy="236" r="7"/>
    <circle cx="400" cy="178" r="7"/>
    <circle cx="580" cy="140" r="7"/>
    <circle cx="670" cy="112" r="7"/>
  </g>

  <!-- Comparison bars: two books quoting the same market -->
  <g>
    <rect x="150" y="304" width="46" height="34" rx="6" fill="#22c55e" fill-opacity="0.55"/>
    <rect x="210" y="316" width="46" height="22" rx="6" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="300" y="298" width="46" height="40" rx="6" fill="#22c55e" fill-opacity="0.55"/>
    <rect x="360" y="312" width="46" height="26" rx="6" fill="#94a3b8" fill-opacity="0.5"/>
    <rect x="450" y="308" width="46" height="30" rx="6" fill="#22c55e" fill-opacity="0.55"/>
    <rect x="510" y="318" width="46" height="20" rx="6" fill="#94a3b8" fill-opacity="0.5"/>
  </g>

  <!-- Odds chips -->
  <g>
    <rect x="110" y="66" width="120" height="34" rx="8" fill="#38bdf8" fill-opacity="0.22" stroke="#38bdf8" stroke-opacity="0.5"/>
    <rect x="244" y="66" width="120" height="34" rx="8" fill="#a78bfa" fill-opacity="0.22" stroke="#a78bfa" stroke-opacity="0.5"/>
    <rect x="378" y="66" width="120" height="34" rx="8" fill="#22c55e" fill-opacity="0.22" stroke="#22c55e" stroke-opacity="0.5"/>
    <rect x="512" y="66" width="120" height="34" rx="8" fill="#f59e0b" fill-opacity="0.22" stroke="#f59e0b" stroke-opacity="0.5"/>
  </g>
</svg>
