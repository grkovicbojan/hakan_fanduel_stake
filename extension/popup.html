<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SportBet Extension</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        min-width: 520px;
        max-width: 720px;
        padding: 12px;
      }
      .row {
        display: flex;
        gap: 8px;
        margin-top: 8px;
      }
      input {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
      }
      button {
        padding: 8px 10px;
      }
      .status {
        margin-top: 8px;
        font-weight: bold;
      }
      .hint {
        margin-top: 6px;
        font-size: 12px;
        color: #555;
      }
      .detail-label {
        margin-top: 10px;
        font-size: 12px;
        font-weight: bold;
        color: #333;
      }
      .table-wrap {
        margin-top: 4px;
        overflow-x: auto;
        max-height: 260px;
        overflow-y: auto;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      table.sub-urls {
        width: 100%;
        border-collapse: collapse;
        font-size: 11px;
      }
      table.sub-urls th,
      table.sub-urls td {
        border: 1px solid #ddd;
        padding: 6px 8px;
        text-align: left;
        vertical-align: top;
      }
      table.sub-urls th {
        background: #eee;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      table.sub-urls tr.stale-row td {
        background: #fff8e6;
      }
      table.sub-urls td.num {
        white-space: nowrap;
        text-align: right;
      }
      table.task-history {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
      }
      table.task-history th,
      table.task-history td {
        border: 1px solid #ddd;
        padding: 4px 6px;
        text-align: left;
        vertical-align: top;
        word-break: break-word;
      }
      table.task-history th {
        background: #eee;
        position: sticky;
        top: 0;
        z-index: 1;
      }
      table.task-history td.mono {
        font-family: Consolas, monospace;
        white-space: nowrap;
      }
      table.task-history td.ok {
        color: #0a6b2a;
      }
      table.task-history td.err {
        color: #a30f0f;
      }
      .table-wrap.task-history-wrap {
        max-height: 180px;
      }
      pre#schedulerDetail {
        margin: 4px 0 0;
        padding: 8px;
        font-size: 11px;
        line-height: 1.35;
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 160px;
        overflow: auto;
        background: #f4f4f4;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
    
/* ------------------------------------------------------- scrollbars (shared)
   Default scrollbars are a light-grey chrome widget that sits badly on a dark
   panel and changes width between platforms, which shifts layout. These are
   theme-aware, overlay-thin, and sized identically everywhere.

   Two mechanisms, both needed:
     * scrollbar-width / scrollbar-color — the standard, Firefox and modern
       Chromium. Only accepts a thumb and track colour, nothing else.
     * ::-webkit-scrollbar-* — Chromium and Safari, where the finer control is.
   Colours come from existing theme variables, with literal fallbacks so this
   block still works when pasted into a page that has no token layer.

   Scroll containers also get overscroll-behavior so a table that reaches its
   end stops rather than scrolling the page behind it, and a momentum flag for
   iOS. */

:root {
  --sb-size: 10px;
  --sb-thumb: color-mix(in srgb, currentColor 26%, transparent);
  --sb-thumb-hover: color-mix(in srgb, currentColor 45%, transparent);
  --sb-track: transparent;
}

/* color-mix is widely supported but not universal; these fall back to fixed
   translucent values where it is missing. */
@supports not (color: color-mix(in srgb, red 50%, transparent)) {
  :root {
    --sb-thumb: rgba(128, 149, 173, 0.42);
    --sb-thumb-hover: rgba(128, 149, 173, 0.68);
  }
}

* {
  scrollbar-width: thin;
  scrollbar-color: var(--sb-thumb) var(--sb-track);
}

*::-webkit-scrollbar {
  width: var(--sb-size);
  height: var(--sb-size);
}

*::-webkit-scrollbar-track {
  background: var(--sb-track);
  border-radius: 999px;
}

*::-webkit-scrollbar-thumb {
  background: var(--sb-thumb);
  border-radius: 999px;
  /* A transparent border with background-clip gives the thumb breathing room
     inside the gutter, so it reads as a floating pill rather than a bar
     welded to the edge. */
  border: 2px solid transparent;
  background-clip: padding-box;
}

*::-webkit-scrollbar-thumb:hover {
  background: var(--sb-thumb-hover);
  background-clip: padding-box;
}

*::-webkit-scrollbar-corner { background: transparent; }

/* Any element that scrolls: keep the gesture contained and smooth. */
.table-wrap,
.scroll-x,
.scroll-y,
pre,
textarea {
  overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch;
}

/* Horizontal scroll container that hints there is more to the right. The
   gradient is painted on the container background and pinned with
   background-attachment: local, so it appears only when content overflows and
   fades out as the user reaches each end. */
.scroll-x,
.table-wrap {
  overflow-x: auto;
  background:
    linear-gradient(to right, var(--bg-elevated, #fff) 30%, rgba(0, 0, 0, 0)) left center,
    linear-gradient(to left, var(--bg-elevated, #fff) 30%, rgba(0, 0, 0, 0)) right center,
    radial-gradient(farthest-side at 0 50%, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0)) left center,
    radial-gradient(farthest-side at 100% 50%, rgba(0, 0, 0, 0.22), rgba(0, 0, 0, 0)) right center;
  background-repeat: no-repeat;
  background-size: 40px 100%, 40px 100%, 14px 100%, 14px 100%;
  background-attachment: local, local, scroll, scroll;
}

/* Vertical scroll container with a capped height — used for any table or list
   that would otherwise run past the fold. */
.scroll-y {
  overflow-y: auto;
  max-height: min(70vh, 640px);
}

@media (prefers-reduced-motion: no-preference) {
  html { scroll-behavior: smooth; }
}

    </style>
  </head>
  <body>
    <h3>Main Website</h3>
    <input id="mainUrl" placeholder="https://sportsbook.fanduel.com" />
    <div class="row">
      <button id="startBtn">Start</button>
      <button id="stopBtn">Stop</button>
    </div>
    <div class="status" id="connectionStatus">Connection: 🔴</div>
    <div class="status" id="monitoringStatus">Monitoring: —</div>
    <div class="hint" id="trackingHint"></div>

    <div class="detail-label">Sub-URLs (from server)</div>
    <div class="table-wrap">
      <table class="sub-urls" data-ww-page-size="10">
        <thead>
          <tr>
            <th>Name</th>
            <th>Target opened</th>
            <th>Scraped</th>
            <th>Refreshed</th>
            <th>Loading time</th>
          </tr>
        </thead>
        <tbody id="subUrlTableBody"></tbody>
      </table>
    </div>
    <div class="hint" id="subUrlTableHint"></div>

    <div class="detail-label">Tasks added (last 10)</div>
    <div class="table-wrap task-history-wrap">
      <table class="task-history" data-ww-page-size="10">
        <thead>
          <tr>
            <th>When</th>
            <th>Type</th>
            <th>URL</th>
            <th>Tab</th>
            <th>Due</th>
            <th>Seq</th>
          </tr>
        </thead>
        <tbody id="taskAddedBody"></tbody>
      </table>
    </div>

    <div class="detail-label">Tasks accomplished (last 10)</div>
    <div class="table-wrap task-history-wrap">
      <table class="task-history" data-ww-page-size="10">
        <thead>
          <tr>
            <th>When</th>
            <th>Type</th>
            <th>URL</th>
            <th>Tab</th>
            <th>Due</th>
            <th>Seq</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="taskDoneBody"></tbody>
      </table>
    </div>

    <div class="detail-label">Scheduler</div>
    <pre id="schedulerDetail"></pre>
    <script src="./ww-table.js"></script>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
